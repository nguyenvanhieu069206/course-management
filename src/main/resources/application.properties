spring.application.name=course-management

# ---------- SQL Server connection ----------
spring.datasource.url=jdbc:sqlserver://DESKTOP-L41HS2S\\SQLEXPRESS;databaseName=CourseManagementDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
