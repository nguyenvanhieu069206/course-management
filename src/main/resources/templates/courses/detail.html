<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${course.name}"></title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; }
        .container { padding: 0 20px 40px; max-width: 700px; }
        .info div { margin-bottom: 8px; }
        .images { display:flex; flex-wrap:wrap; gap:14px; margin-top:10px; }
        .image-card { border:1px solid #ddd; padding:8px; width:180px; text-align:center; }
        .image-card img { width:100%; height:110px; object-fit:cover; background:#eee; }
        .thumb-badge { background:#27ae60; color:#fff; padding:2px 6px; font-size:0.8em; border-radius:4px; }
        .msg-success { color:green; }
        .msg-error { color:red; }
        button, input[type=submit] { padding:6px 12px; background:#2c3e50; color:#fff; border:none; cursor:pointer; border-radius:4px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <p class="msg-success" th:if="${successMessage}" th:text="${successMessage}"></p>
    <p class="msg-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <h2 th:text="${course.name}"></h2>
    <div class="info">
        <div><b>Loại khóa học:</b> <span th:text="${course.category.name}"></span></div>
        <div><b>Học phí:</b> <span th:text="${course.tuitionFee}"></span></div>
        <div><b>Thời lượng:</b> <span th:text="${course.duration} + ' giờ (' + ${course.durationType} + ')'"></span></div>
        <div><b>Trạng thái:</b>
            <span th:if="${course.isActive}">Đang tuyển sinh</span>
            <span th:unless="${course.isActive}" style="color:#c0392b;">Ngừng tuyển sinh</span>
        </div>
        <div><b>Mô tả:</b> <span th:text="${course.description}"></span></div>
    </div>

    <p>
        <a th:href="@{/courses/{id}/edit(id=${course.id})}">Sửa khóa học</a> |
        <a th:href="@{/courses}">Quay lại danh sách</a>
    </p>

    <h3>Ảnh khóa học</h3>
    <p th:if="${#lists.isEmpty(images)}">Khóa học chưa có ảnh nào.</p>
    <div class="images">
        <div class="image-card" th:each="img : ${images}">
            <img th:src="${img.imageUrl}" alt="course image"/>
            <div>
                <span th:if="${img.isThumbnail}" class="thumb-badge">Ảnh đại diện</span>
            </div>
            <form th:if="${!img.isThumbnail}" method="post"
                  th:action="@{/courses/{id}/images/{imageId}/thumbnail(id=${course.id},imageId=${img.id})}"
                  style="margin-top:6px;">
                <button type="submit">Chọn làm đại diện</button>
            </form>
        </div>
    </div>

    <h3>Thêm ảnh mới</h3>
    <form method="post" th:action="@{/courses/{id}/images(id=${course.id})}">
        <input type="text" name="imageUrl" placeholder="https://..." style="width:300px;" required/>
        <button type="submit">Thêm ảnh</button>
    </form>
</div>
</body>
</html>
