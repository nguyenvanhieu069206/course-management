<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Danh sách khóa học</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; }
        .container { padding: 0 20px 40px; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f4f4f4; }
        form.filter-form label { display: inline-block; width: 140px; margin-top: 6px; }
        .msg-success { color: green; margin-top: 10px; }
        .msg-error { color: red; margin-top: 10px; }
        .badge-short { background:#d4edda; padding:2px 8px; border-radius:4px; }
        .badge-long { background:#fff3cd; padding:2px 8px; border-radius:4px; }
        .badge-inactive { color:#c0392b; font-weight:bold; }
        a.btn, button.btn { display:inline-block; padding:6px 12px; background:#2c3e50; color:#fff; text-decoration:none; border:none; cursor:pointer; border-radius:4px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <h2>Danh sách khóa học</h2>

    <p class="msg-success" th:if="${successMessage}" th:text="${successMessage}"></p>
    <p class="msg-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <p class="msg-error" th:if="${feeRangeError}" th:text="${feeRangeError}"></p>

    <a class="btn" href="/courses/new">+ Thêm khóa học</a>

    <form class="filter-form" method="get" action="/courses" style="margin-top:20px; border:1px solid #ddd; padding:15px;">
        <div>
            <label>Tên khóa học:</label>
            <input type="text" name="name" th:value="${searchForm.name}" placeholder="Tìm theo tên..."/>
        </div>
        <div>
            <label>Loại khóa học:</label>
            <select name="categoryId">
                <option value="">-- Tất cả --</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                        th:selected="${searchForm.categoryId != null and searchForm.categoryId == cat.id}"></option>
            </select>
        </div>
        <div>
            <label>Trạng thái:</label>
            <select name="isActive">
                <option value="" th:selected="${searchForm.isActive == null}">-- Tất cả --</option>
                <option value="true" th:selected="${searchForm.isActive != null and searchForm.isActive}">Đang tuyển sinh</option>
                <option value="false" th:selected="${searchForm.isActive != null and !searchForm.isActive}">Ngừng tuyển sinh</option>
            </select>
        </div>
        <div>
            <label>Học phí từ:</label>
            <input type="number" step="0.01" name="minFee" th:value="${searchForm.minFee}"/>
        </div>
        <div>
            <label>Học phí đến:</label>
            <input type="number" step="0.01" name="maxFee" th:value="${searchForm.maxFee}"/>
        </div>
        <div>
            <label>Sắp xếp:</label>
            <select name="sortBy">
                <option value="" th:selected="${searchForm.sortBy == null or searchForm.sortBy == ''}">-- Mặc định --</option>
                <option value="fee_asc" th:selected="${searchForm.sortBy == 'fee_asc'}">Học phí tăng dần</option>
                <option value="fee_desc" th:selected="${searchForm.sortBy == 'fee_desc'}">Học phí giảm dần</option>
                <option value="duration_asc" th:selected="${searchForm.sortBy == 'duration_asc'}">Thời lượng tăng dần</option>
            </select>
        </div>
        <div style="margin-top:10px;">
            <button class="btn" type="submit">Tìm kiếm</button>
            <a class="btn" href="/courses" style="background:#7f8c8d;">Xóa lọc</a>
        </div>
    </form>

    <p th:if="${noResult}" style="margin-top:20px;">Không tìm thấy khóa học phù hợp.</p>

    <table th:if="${!noResult}">
        <thead>
        <tr>
            <th>Tên khóa học</th>
            <th>Loại khóa học</th>
            <th>Học phí</th>
            <th>Thời lượng (giờ)</th>
            <th>Phân loại</th>
            <th>Trạng thái</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${courses}">
            <td th:text="${course.name}"></td>
            <td th:text="${course.category.name}"></td>
            <td th:text="${course.tuitionFee}"></td>
            <td th:text="${course.duration}"></td>
            <td>
                <span th:if="${course.durationType == 'Ngắn hạn'}" class="badge-short" th:text="${course.durationType}"></span>
                <span th:unless="${course.durationType == 'Ngắn hạn'}" class="badge-long" th:text="${course.durationType}"></span>
            </td>
            <td>
                <span th:if="${course.isActive}">Đang tuyển sinh</span>
                <span th:unless="${course.isActive}" class="badge-inactive">Ngừng tuyển sinh</span>
            </td>
            <td>
                <a th:href="@{/courses/{id}(id=${course.id})}">Xem</a> |
                <a th:href="@{/courses/{id}/edit(id=${course.id})}">Sửa</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
