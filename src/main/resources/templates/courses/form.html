<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${isEdit} ? 'Sửa khóa học' : 'Thêm khóa học'"></title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; }
        .container { padding: 0 20px 40px; max-width: 600px; }
        .field { margin-bottom: 14px; }
        label { display:block; margin-bottom:4px; font-weight:bold; }
        input, select, textarea { width:100%; padding:6px; box-sizing:border-box; }
        .error { color:red; font-size: 0.9em; }
        button { padding:8px 16px; background:#2c3e50; color:#fff; border:none; cursor:pointer; border-radius:4px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <h2 th:text="${isEdit} ? 'Sửa khóa học' : 'Thêm khóa học'"></h2>

    <form method="post" th:action="${isEdit} ? @{/courses/{id}(id=${course.id})} : @{/courses}"
          th:object="${course}">

        <div class="field">
            <label>Tên khóa học</label>
            <input type="text" th:field="*{name}"/>
            <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="field">
            <label>Loại khóa học</label>
            <select th:field="*{category.id}">
                <option value="">-- Chọn loại khóa học --</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
        </div>

        <div class="field">
            <label>Học phí</label>
            <input type="number" step="0.01" th:field="*{tuitionFee}"/>
            <div class="error" th:if="${#fields.hasErrors('tuitionFee')}" th:errors="*{tuitionFee}"></div>
        </div>

        <div class="field">
            <label>Thời lượng (giờ)</label>
            <input type="number" th:field="*{duration}"/>
            <div class="error" th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}"></div>
        </div>

        <div class="field">
            <label>Trạng thái</label>
            <select th:field="*{isActive}">
                <option value="true">Đang tuyển sinh</option>
                <option value="false">Ngừng tuyển sinh</option>
            </select>
        </div>

        <div class="field">
            <label>Mô tả</label>
            <textarea th:field="*{description}" rows="4"></textarea>
        </div>

        <button type="submit" th:text="${isEdit} ? 'Lưu thay đổi' : 'Tạo khóa học'"></button>
        <a th:href="@{/courses}" style="margin-left:10px;">Hủy</a>
    </form>
</div>
</body>
</html>
